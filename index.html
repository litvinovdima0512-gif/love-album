<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наше Пространство</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #ffafbd 0%, #ffc3a0 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        h1 { font-size: 24px; margin-bottom: 20px; }

        .container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 30px;
            text-align: center;
            width: 85%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .screenshot {
            width: 100%;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 3px solid #fff;
        }

        .timer-box {
            background: #fff;
            color: #ff6b6b;
            padding: 15px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.5;
        }

        /* Анимация сердечек */
        .heart {
            position: fixed;
            color: #fff;
            animation: move linear infinite;
            top: -10%;
            z-index: -1;
        }
        @keyframes move {
            0% { transform: translateY(0) rotate(0); opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ты всегда со мной ❤️</h1>
        
        <img src="screenshot.jpg" class="screenshot" alt="Наш момент">

        <div class="timer-box" id="timer">Загружаю...</div>
    </div>

    <script>
// Указываем дату строго в формате ISO
const startDate = new Date("2026-02-21T00:00:00").getTime();

function updateTimer() {
    const now = new Date().getTime();
    const diff = now - startDate;

    // Если дата еще не наступила (на всякий случай)
    if (diff < 0) {
        document.getElementById("timer").innerHTML = "Совсем скоро... ✨";
        return;
    }

    // Расчеты
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const secs = Math.floor((diff % (1000 * 60)) / 1000);

    // Вывод текста
    document.getElementById("timer").innerHTML = 
        "Мы вместе уже:<br>" + days + "д. " + hours + "ч. " + mins + "м. " + secs + "с. 🥰";
}

// Запускаем обновление каждую секунду
setInterval(updateTimer, 1000);

// Сразу вызываем один раз, чтобы не ждать секунду
updateTimer();

// Функция для сердечек (оставляем как была)
function createHeart() {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.innerHTML = '❤️';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.position = 'fixed';
    heart.style.top = '-10%';
    heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
    heart.style.animation = 'move ' + (Math.random() * 3 + 2) + 's linear forwards';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
}
setInterval(createHeart, 400);
    </script>
</body>
</html>
