<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наше Пространство</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ffe0e9, #ffb3c6);
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
            color: #d11e4c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Ваш Скриншот */
        .screenshot {
            max-width: 85%;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        .screenshot:hover {
            transform: scale(1.03);
        }

        /* Таймер времени вместе */
        .time-together {
            margin-top: 30px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            background: white;
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* Летающие сердечки (анимация) */
        .heart {
            position: fixed;
            font-size: 24px;
            color: #ff4d6d;
            animation: fall linear infinite;
            pointer-events: none;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1 style="margin-bottom: 30px;">Ты всегда со мной ❤️</h1>

    <img src="screenshot.png" alt="Наш момент" class="screenshot">

    <div class="time-together" id="time-together">Загружаю...</div>

    <script>
        // Дата вашего знакомства (Год, Месяц - 1, День, Час, Минута)
        // ВНИМАНИЕ: Месяцы считаются с 0 (Январь - 0, Февраль - 1)
        const relationshipStart = new Date(2026, 1, 21, 0, 0, 0).getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const distance = now - relationshipStart;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("time-together").innerHTML = 
                Мы вместе уже ${days} дн., ${hours} час., ${minutes} мин. и ${seconds} сек. 🥰;
        }

        // Анимация сердечек
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }

        setInterval(updateTimer, 1000); // Обновляем таймер каждую секунду
        setInterval(createHeart, 300); // Создаем сердечки каждые 0.3 сек.
        updateTimer(); // Запускаем таймер сразу
    </script>
</body>
</html>
