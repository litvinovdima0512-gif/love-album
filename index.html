<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Наше Пространство ❤️</title>
    <style>
        body { margin: 0; padding: 0; background: linear-gradient(180deg, #ff9a9e 0%, #fecfef 100%); font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #fff; overflow: hidden; }
        .container { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 20px; border-radius: 30px; text-align: center; width: 85%; max-width: 350px; border: 1px solid rgba(255,255,255,0.3); }
        .screenshot { width: 100%; border-radius: 20px; margin-bottom: 15px; border: 2px solid #fff; }
        .timer-box { background: #fff; color: #ff758c; padding: 15px; border-radius: 20px; font-size: 16px; font-weight: bold; }
        .music-btn { margin-top: 15px; background: #fff; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Сквозь города ❤️</h1>
        <img src="screenshot.jpg" class="screenshot">
        <div class="timer-box" id="timer">Запуск...</div>
        <button class="music-btn" onclick="playMusic()" id="mBtn">🎵</button>
    </div>

    <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <script>
        // Дата: 21 февраля 2026. Месяц пишем числом (1 = Февраль)
        const start = new Date(2026, 1, 21, 0, 0, 0).getTime();

        function update() {
            const now = new Date().getTime();
            const d = now - start;
            const days = Math.floor(d / 86400000);
            const hrs = Math.floor((d % 86400000) / 3600000);
            const mns = Math.floor((d % 3600000) / 60000);
            const scs = Math.floor((d % 60000) / 1000);
            document.getElementById("timer").innerHTML = Мы вместе:<br>${days}д. ${hrs}ч. ${mns}м. ${scs}с. 🥰;
        }
        setInterval(update, 1000);
        update();

        function playMusic() {
            const a = document.getElementById("bgMusic");
            const b = document.getElementById("mBtn");
            if (a.paused) { a.play(); b.innerHTML = "⏸️"; } 
            else { a.pause(); b.innerHTML = "🎵"; }
        }
    </script>
</body>
</html>
