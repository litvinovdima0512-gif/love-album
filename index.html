<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Наше Пространство ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Нежный градиент */
            background: linear-gradient(180deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 30px;
            text-align: center;
            width: 85%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            z-index: 2;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 15px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.1);
        }

        .screenshot {
            width: 100%;
            height: auto;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 3px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .timer-box {
            background: #fff;
            color: #ff758c;
            padding: 15px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Кнопка управления музыкой */
        .music-control {
            margin-top: 20px;
            background: #fff;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .music-control:active { transform: scale(0.9); }

        /* Анимация сердечек на фоне */
        .heart {
            position: fixed;
            color: rgba(255,255,255,0.6);
            top: -10%;
            pointer-events: none;
            z-index: 1;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Сквозь любые города ❤️</h1>
        
        <img src="screenshot.jpg" class="screenshot" alt="Наш момент">

        <div class="timer-box" id="timer">Загружаю...</div>

        <button class="music-control" onclick="toggleMusic()" id="mBtn">🎵</button>
    </div>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ДАТА: 21 февраля 2026. Формат ISO самый надежный для всех браузеров.
        const startDate = new Date("2026-02-21T00:00:00").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const diff = now - startDate;

            if (isNaN(diff) || diff < 0) {
                document.getElementById("timer").innerHTML = "Наше время начнется скоро! ✨";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("timer").innerHTML = 
                Мы вместе уже:<br>${days}д. ${hours}ч. ${mins}м. ${secs}с. 🥰;
        }
        // Запуск таймера
        setInterval(updateTimer, 1000);
        updateTimer();

        // Логика музыки
        const audio = document.getElementById("bgMusic");
        function toggleMusic() {
            if (audio.paused) {
                audio.play().catch(e => alert("Нажми еще раз для включения звука!"));
                document.getElementById("mBtn").innerHTML = "⏸️";
            } else {
                audio.pause();
                document.getElementById("mBtn").innerHTML = "🎵";
            }
        }

        // Создание падающих сердечек
        function createHeart() {
            const h = document.createElement('div');
            h.className = 'heart';
            h.innerHTML = '❤️';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = Math.random() * 20 + 10 + 'px';
            h.style.animationDuration = Math.random() * 3 + 3 + 's';
            h.style.opacity = Math.random();
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 6000);
        }
        setInterval(createHeart, 400);
    </script>
</body>
</html>
